<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지 이동 중 | TOOLBOX</title>
  </head>
  <body>
    <p>요청한 TOOLBOX 페이지로 이동하고 있습니다…</p>
    <script>
      (function () {
        var redirect = location.pathname + location.search + location.hash;
        try {
          sessionStorage.setItem("toolbox:github-pages-redirect", redirect);
        } catch (_) {}
        location.replace("/TOOLBOX/");
      })();
    </script>
  </body>
</html>
