# TOOLBOX v0.14.82 — Canonicalize legacy project-path URLs before SPA fallback.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://toolboxbox.netlify.app"

# Older links may still contain the former GitHub Pages project path.
# Redirect them to the equivalent canonical Netlify path to avoid rendering the SPA 404.
[[redirects]]
  from = "/TOOLBOX"
  to = "/"
  status = 301

[[redirects]]
  from = "/TOOLBOX/*"
  to = "/:splat"
  status = 301

# Serve existing static assets normally; route app paths through the SPA entry point.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
