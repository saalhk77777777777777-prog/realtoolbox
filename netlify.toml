# TOOLBOX v0.14.73 — Netlify SPA route fallback fix
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://toolboxbox.netlify.app"

# Serve existing static assets normally; route app paths through the SPA entry point.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
